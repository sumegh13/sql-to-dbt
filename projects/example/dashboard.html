const R=[{"id": 1, "slug": "uspcustomerlifetime", "difficulty": "unknown", "tags": [], "status": "verified", "attempts": 1, "rows": 112, "datasets": {"base": 29, "seed_101": 31, "seed_202": 37, "edge": 15}, "param_sets": 1, "model_sql": "WITH spend AS (\n    SELECT\n        o.CustomerID,\n        MIN(o.OrderDate) AS FirstOrder,\n        MAX(o.OrderDate) AS LastOrder,\n        CAST(SUM(l.Quantity * l.UnitPrice) AS DECIMAL(14,2)) AS Revenue\n    FROM {{ source('legacy', 'Sales_Orders') }} o\n    JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n        ON l.OrderID = o.OrderID\n    WHERE rtrim(lower(o.Status)) IN ('shipped', 'closed')\n    GROUP BY o.CustomerID\n)\nSELECT\n    c.CustomerID,\n    c.CustomerName,\n    CAST(COALESCE(s.Revenue, 0) AS DECIMAL(14,2)) AS Revenue,\n    CASE\n        WHEN s.FirstOrder IS NULL THEN NULL\n        ELSE CAST(\n            (CAST(year(s.LastOrder) AS INTEGER) * 12 + CAST(month(s.LastOrder) AS INTEGER))\n          - (CAST(year(s.FirstOrder) AS INTEGER) * 12 + CAST(month(s.FirstOrder) AS INTEGER))\n            AS INTEGER)\n    END AS TenureMonths,\n    CASE\n        WHEN s.Revenue IS NULL THEN 'none'\n        WHEN s.Revenue >= 2000 THEN 'high'\n        WHEN s.Revenue >= 500 THEN 'mid'\n        ELSE 'low'\n    END AS Segment\nFROM {{ source('legacy', 'Customers') }} c\nLEFT JOIN spend s\n    ON s.CustomerID = c.CustomerID", "param_filter": null, "param_mode": "filter", "history": [{"attempt": 1, "sql": "WITH spend AS (\n    SELECT\n        o.CustomerID,\n        MIN(o.OrderDate) AS FirstOrder,\n        MAX(o.OrderDate) AS LastOrder,\n        CAST(SUM(l.Quantity * l.UnitPrice) AS DECIMAL(14,2)) AS Revenue\n    FROM {{ source('legacy', 'Sales_Orders') }} o\n    JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n        ON l.OrderID = o.OrderID\n    WHERE rtrim(lower(o.Status)) IN ('shipped', 'closed')\n    GROUP BY o.CustomerID\n)\nSELECT\n    c.CustomerID,\n    c.CustomerName,\n    CAST(COALESCE(s.Revenue, 0) AS DECIMAL(14,2)) AS Revenue,\n    CASE\n        WHEN s.FirstOrder IS NULL THEN NULL\n        ELSE CAST(\n            (CAST(year(s.LastOrder) AS INTEGER) * 12 + CAST(month(s.LastOrder) AS INTEGER))\n          - (CAST(year(s.FirstOrder) AS INTEGER) * 12 + CAST(month(s.FirstOrder) AS INTEGER))\n            AS INTEGER)\n    END AS TenureMonths,\n    CASE\n        WHEN s.Revenue IS NULL THEN 'none'\n        WHEN s.Revenue >= 2000 THEN 'high'\n        WHEN s.Revenue >= 500 THEN 'mid'\n        ELSE 'low'\n    END AS Segment\nFROM {{ source('legacy', 'Customers') }} c\nLEFT JOIN spend s\n    ON s.CustomerID = c.CustomerID", "param_filter": null, "param_mode": "filter", "status": "match", "detail": {"runs": 4, "rows": 112}}], "explanation": "This procedure ranks each customer by spending on completed orders. It totals each customer's line revenue (quantity times unit price) across orders marked shipped or closed, and records the first and last order dates. Every customer is then listed, with zero revenue if they have no qualifying orders, a tenure in months between their first and last order, and a segment of none, low, mid, or high based on revenue.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 2037, "output_tokens": 2450, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.001429}], "cost_usd": 0.001429, "legacy_sql": "CREATE PROCEDURE Sales.uspCustomerLifetime\nAS\nBEGIN\n    SET NOCOUNT ON;\n    CREATE TABLE #spend (CustomerID INT, FirstOrder DATE, LastOrder DATE, Revenue DECIMAL(14,2));\n    INSERT INTO #spend\n    SELECT o.CustomerID, MIN(o.OrderDate), MAX(o.OrderDate), SUM(l.Quantity * l.UnitPrice)\n    FROM Sales.Orders o JOIN Sales.OrderLines l ON l.OrderID = o.OrderID\n    WHERE o.Status IN ('shipped', 'closed')\n    GROUP BY o.CustomerID;\n\n    SELECT c.CustomerID, c.CustomerName,\n           ISNULL(s.Revenue, 0) AS Revenue,\n           DATEDIFF(month, s.FirstOrder, s.LastOrder) AS TenureMonths,\n           CASE WHEN s.Revenue IS NULL THEN 'none'\n
