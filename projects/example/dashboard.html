const R=[{"id": 1, "slug": "uspcustomerlifetime", "difficulty": "unknown", "tags": [], "status": "verified", "attempts": 1, "rows": 112, "datasets": {"base": 29, "seed_101": 31, "seed_202": 37, "edge": 15}, "param_sets": 1, "model_sql": "WITH spend AS (\n    SELECT\n        o.CustomerID,\n        MIN(o.OrderDate) AS FirstOrder,\n        MAX(o.OrderDate) AS LastOrder,\n        CAST(SUM(l.Quantity * l.UnitPrice) AS DECIMAL(14,2)) AS Revenue\n    FROM {{ source('legacy', 'Sales_Orders') }} o\n    JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n        ON l.OrderID = o.OrderID\n    WHERE rtrim(lower(o.Status)) IN ('shipped', 'closed')\n    GROUP BY o.CustomerID\n)\nSELECT\n    c.CustomerID,\n    c.CustomerName,\n    COALESCE(s.Revenue, 0) AS Revenue,\n    date_diff('month', s.FirstOrder, s.LastOrder) AS TenureMonths,\n    CASE\n        WHEN s.Revenue IS NULL THEN 'none'\n        WHEN s.Revenue >= 2000 THEN 'high'\n        WHEN s.Revenue >= 500 THEN 'mid'\n        ELSE 'low'\n    END AS Segment\nFROM {{ source('legacy', 'Customers') }} c\nLEFT JOIN spend s\n    ON s.CustomerID = c.CustomerID", "param_filter": null, "history": [{"attempt": 1, "sql": "WITH spend AS (\n    SELECT\n        o.CustomerID,\n        MIN(o.OrderDate) AS FirstOrder,\n        MAX(o.OrderDate) AS LastOrder,\n        CAST(SUM(l.Quantity * l.UnitPrice) AS DECIMAL(14,2)) AS Revenue\n    FROM {{ source('legacy', 'Sales_Orders') }} o\n    JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n        ON l.OrderID = o.OrderID\n    WHERE rtrim(lower(o.Status)) IN ('shipped', 'closed')\n    GROUP BY o.CustomerID\n)\nSELECT\n    c.CustomerID,\n    c.CustomerName,\n    COALESCE(s.Revenue, 0) AS Revenue,\n    date_diff('month', s.FirstOrder, s.LastOrder) AS TenureMonths,\n    CASE\n        WHEN s.Revenue IS NULL THEN 'none'\n        WHEN s.Revenue >= 2000 THEN 'high'\n        WHEN s.Revenue >= 500 THEN 'mid'\n        ELSE 'low'\n    END AS Segment\nFROM {{ source('legacy', 'Customers') }} c\nLEFT JOIN spend s\n    ON s.CustomerID = c.CustomerID", "param_filter": null, "status": "match", "detail": {"runs": 4, "rows": 112}}], "explanation": "This procedure builds a per-customer spending summary from orders with status 'shipped' or 'closed'. For each customer it totals line revenue (quantity times unit price), finds the first and last order dates, and computes the number of months between them. Every customer is listed, with zero revenue shown as a 'none' segment when they have no qualifying orders, and 'low', 'mid', or 'high' otherwise based on revenue thresholds.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 2035, "output_tokens": 1871, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.001139}], "cost_usd": 0.001139, "legacy_sql": "CREATE PROCEDURE Sales.uspCustomerLifetime\nAS\nBEGIN\n    SET NOCOUNT ON;\n    CREATE TABLE #spend (CustomerID INT, FirstOrder DATE, LastOrder DATE, Revenue DECIMAL(14,2));\n    INSERT INTO #spend\n    SELECT o.CustomerID, MIN(o.OrderDate), MAX(o.OrderDate), SUM(l.Quantity * l.UnitPrice)\n    FROM Sales.Orders o JOIN Sales.OrderLines l ON l.OrderID = o.OrderID\n    WHERE o.Status IN ('shipped', 'closed')\n    GROUP BY o.CustomerID;\n\n    SELECT c.CustomerID, c.CustomerName,\n           ISNULL(s.Revenue, 0) AS Revenue,\n           DATEDIFF(month, s.FirstOrder, s.LastOrder) AS TenureMonths,\n           CASE WHEN s.Revenue IS NULL THEN 'none'\n                WHEN s.Revenue >= 2000 THEN 'high'\n                WHEN s.Revenue >= 500 THEN 'mid' ELSE 'low' END AS Segment\n    FROM dbo.Customers c LEFT JOIN #spend s ON s.CustomerID = c.CustomerID;\nEND\n", "name": "001_uspcustomerlifetime"}, {"id": 2, "slug": "uspdeactivatedormantcustomers", "difficulty": "unknown", "tags": [], "status": "needs_human", "reason_category": "mutates_source", "reason": "Modifies existing tables in place (dbo.customers); a dbt model can only build new relations, so this needs a design decision (incremental/snapshot/ops job).", "attempts": 1, " , so a row filter over stored columns cannot reproduce the output values.", "assumptions": "- Status comparisons are case-insensitive and ignore trailing spaces, as in SQL Server's default collation, so the 'inactive' test is lower(rtrim(Status)) = 'inactive'.\n- The NOT EXISTS subquery is equivalent to \"MAX(OrderDate) is NULL or MAX(OrderDate) < @AsOfDate - 180 days\", since OrderDate is a date with no time part.\n- Customers with a NULL CustomerID or no orders have no matching order, so they count as dormant, as they do in the procedure's NOT EXISTS.\n- The UPDATE ran against the Customers table as it stood before the procedure was called, so the model reads the pre-update state.", "questions": "- Should the output be produced by a model that persists the updated Status (a snapshot or an incremental job that actually runs the UPDATE), or is the read-only result set the only thing that must match?\n- Is the Status value in the output meant to be the post-update value ('inactive' for every row returned), and if so, which @AsOfDate should the model be built for?\n- If the procedure is run more than once, or for several as-of dates, should a customer deactivated by one run stay inactive in later runs, and how does that interact with the chosen design?\n- Are there case or whitespace variants of 'inactive' in the source data that the case-insensitive match should treat as equal?", "not_migrated": "- The UPDATE that sets dbo.Customers.Status to 'inactive' is not reproduced. The model is read-only and only builds a new relation, so the persisted status change is lost.\n- The Status column in the model is the stored value, not the post-update value. For customers deactivated by @AsOfDate, the model shows the old status (for example 'active'), while the procedure returns 'inactive'. Matching the output requires a design decision (see the flagged review).\n- The procedure's SET NOCOUNT ON has no equivalent and has no effect on the result set.", "verification": "not verified: not_filterable"}, "explanation": "This procedure marks as 'inactive' every customer who has placed no order in the 180 days before the given as-of date. It then returns all customers whose status is 'inactive', which includes both the newly deactivated customers and any that were already inactive. The procedure's output is the list of customer IDs, names and statuses for those customers.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 2022, "output_tokens": 3159, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.001782}], "cost_usd": 0.001782, "legacy_sql": "CREATE PROCEDURE dbo.uspDeactivateDormantCustomers\n    @AsOfDate DATE\nAS\nBEGIN\n    SET NOCOUNT ON;\n    UPDATE c SET Status = 'inactive'\n    FROM dbo.Customers c\n    WHERE NOT EXISTS (SELECT 1 FROM Sales.Orders o WHERE o.CustomerID = c.CustomerID AND o.OrderDate >= DATEADD(day, -180, @AsOfDate));\n    SELECT CustomerID, CustomerName, Status FROM dbo.Customers WHERE Status = 'inactive';\nEND\n", "name": "002_uspdeactivatedormantcustomers"}, {"id": 3, "slug": "uspgetcustomerorders", "difficulty": "unknown", "tags": [], "status": "verified", "attempts": 1, "rows": 12, "datasets": {"base": 5, "seed_101": 4, "seed_202": 2, "edge": 1}, "param_sets": 3, "model_sql": "SELECT\n    o.OrderID,\n    o.OrderDate,\n    o.Status,\n    o.CustomerID,\n    SUM(CAST(l.Quantity * l.UnitPrice * (1 - COALESCE(l.Discount, 0)) AS DECIMAL(38,4))) AS OrderTotal,\n    COUNT(*) AS LineCount\nFROM {{ source('legacy', 'Sales_Orders') }} o\nJOIN {{ source('legacy', 'Sales_OrderLines') }} l\n    ON l.OrderID = o.OrderID\nGROUP BY o.OrderID, o.CustomerID, o.OrderDate, o.Status", "param_filter": "CustomerID = @CustomerID", "history": [{"attempt": 1, "sql": "SELECT\n    o.OrderID,\n    o.OrderDate,\n    o.Status,\n    o.CustomerID,\n    SUM(CAST(l.Quantity * l.UnitPrice * (1 - COALESCE(l.Discount, 0)) AS DECIMAL(38,4))) AS OrderTotal,\n    COUNT(*) AS LineCount\nFROM {{ source('legacy', 'Sales_Orders') }} o\nJOIN {{ source('legacy', 'Sales_OrderLines') }} l\n    ON l.OrderID = o.OrderID\nGROUP BY o.OrderID, o.CustomerID, o.OrderDate, o.Status", "param_filter": "CustomerID = @CustomerID", "status": "match", "detail": {"runs": 12, "rows": 12}}], "explanation": "This procedure returns one row per order for a given customer, showing the order's date and status, its total value after line discounts, and how many lines it has. Each line's value is quantity times unit price, reduced by the discount (treated as zero when missing). The model below covers all customers, and the filter selects the rows for the requested customer. Passing a NULL customer returns nothing, matching the procedure's `=` comparison.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1827, "output_tokens": 1250, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.000808}], "cost_usd": 0.000808, "legacy_sql": "CREATE PROCEDURE Sales.uspGetCustomerOrders\n    @CustomerID INT\nAS\nBEGIN\n    SET NOCOUNT ON;\n    SELECT o.OrderID, o.OrderDate, o.Status,\n           SUM(l.Quantity * l.UnitPrice * (1 - ISNULL(l.Discount, 0))) AS OrderTotal,\n           COUNT(*) AS LineCount\n    FROM Sales.Orders o\n    JOIN Sales.OrderLines l ON l.OrderID = o.OrderID\n    WHERE o.CustomerID = @CustomerID\n    GROUP BY o.OrderID, o.OrderDate, o.Status;\nEND\n", "name": "003_uspgetcustomerorders"}, {"id": 4, "slug": "usprefreshproductsummary", "difficulty": "unknown", "tags": [], "status": "verified", "attempts": 1, "rows": 114, "datasets": {"base": 25, "seed_101": 35, "seed_202": 39, "edge": 15}, "param_sets": 1, "model_sql": "SELECT\n    p.ProductID,\n    p.ProductName,\n    CAST(COALESCE(SUM(l.Quantity), 0) AS INTEGER) AS UnitsSold,\n    CAST(COALESCE(SUM(l.Quantity * l.UnitPrice), 0) AS DECIMAL(14,2)) AS Revenue\nFROM {{ source('legacy', 'Products') }} p\nLEFT JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n    ON l.ProductID = p.ProductID\nGROUP BY p.ProductID, p.ProductName", "param_filter": null, "history": [{"attempt": 1, "sql": "SELECT\n    p.ProductID,\n    p.ProductName,\n    CAST(COALESCE(SUM(l.Quantity), 0) AS INTEGER) AS UnitsSold,\n    CAST(COALESCE(SUM(l.Quantity * l.UnitPrice), 0) AS DECIMAL(14,2)) AS Revenue\nFROM {{ source('legacy', 'Products') }} p\nLEFT JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n    ON l.ProductID = p.ProductID\nGROUP BY p.ProductID, p.ProductName", "param_filter": null, "status": "match", "detail": {"runs": 4, "rows": 114}}], "explanation": "This procedure rebuilds a product sales summary table from scratch. For every product, it totals the units sold and the revenue (quantity times unit price) across all order lines, and it reports zero for products with no sales. The model below gives that same per-product result as a single query, with no parameters.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1808, "output_tokens": 1556, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.000959}], "cost_usd": 0.000959, "legacy_sql": "CREATE PROCEDURE dbo.uspRefreshProductSummary\nAS\nBEGIN\n    SET NOCOUNT ON;\n    TRUNCATE TABLE dbo.ProductSummary;\n    INSERT INTO dbo.ProductSummary (ProductID, ProductName, UnitsSold, Revenue)\n    SELECT p.ProductID, p.ProductName, ISNULL(SUM(l.Quantity), 0), ISNULL(SUM(l.Quantity * l.UnitPrice), 0)\n    FROM dbo.Products p\n    LEFT JOIN Sales.OrderLines l ON l.ProductID = p.ProductID\n    GROUP BY p.ProductID, p.ProductName;\nEND\n", "name": "004_usprefreshproductsummary"}, {"id": 5, "slug": "uspsalesbyregion", "difficulty": "unknown", "tags": [], "status": "needs_human", "reason_category": "parameter_changes_grain", "reason": "Parameters change which rows are aggregated, so no single parameter-free model plus row filter can reproduce it. The procedure returns one total per region over the whole date range, so the date parameters change the aggregated totals themselves. A row filter over the (region, date) grain would return per-day rows that still need re-aggregating, which the harness cannot do.", "attempts": 1, "history": [{"attempt": 1, "sql": "WITH base AS (\n    SELECT\n        o.OrderID,\n        o.OrderDate,\n        ISNULL(c.Region, 'Unassigned') AS region_raw,\n        l.Quantity,\n        l.UnitPrice\n    FROM {{ source('legacy', 'Sales_Orders') }} o\n    JOIN {{ source('legacy', 'Customers') }} c\n        ON c.CustomerID = o.CustomerID\n    JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n        ON l.OrderID = o.OrderID\n    WHERE lower(rtrim(o.Status)) <> 'cancelled'\n)\nSELECT\n    min(region_raw) AS Region,\n    OrderDate,\n    COUNT(DISTINCT OrderID) AS Orders,\n    CAST(SUM(Quantity * UnitPrice) AS DECIMAL(38,2)) AS GrossRevenue\nFROM base\nGROUP BY lower(rtrim(region_raw)), OrderDate", "param_filter": "NOT_FILTERABLE: The procedure returns one total per region over the whole date range, so the date parameters change the aggregated totals themselves. A row filter over the (region, date) grain would return per-day rows that still need re-aggregating, which the harness cannot do.", "status": "not_filterable", "detail": "NOT_FILTERABLE: The procedure returns one total per region over the whole date range, so the date parameters change the aggregated totals themselves. A row filter over the (region, date) grain would return per-day rows that still need re-aggregating, which the harness cannot do."}], "model_sql": "WITH base AS (\n    SELECT\n        o.OrderID,\n        o.OrderDate,\n        ISNULL(c.Region, 'Unassigned') AS region_raw,\n        l.Quantity,\n        l.UnitPrice\n    FROM {{ source('legacy', 'Sales_Orders') }} o\n    JOIN {{ source('legacy', 'Customers') }} c\n        ON c.CustomerID = o.CustomerID\n    JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n        ON l.OrderID = o.OrderID\n    WHERE lower(rtrim(o.Status)) <> 'cancelled'\n)\nSELECT\n    min(region_raw) AS Region,\n    OrderDate,\n    COUNT(DISTINCT OrderID) AS Orders,\n    CAST(SUM(Quantity * UnitPrice) AS DECIMAL(38,2)) AS GrossRevenue\nFROM base\nGROUP BY lower(rtrim(region_raw)), OrderDate", "explanation": "This procedure totals sales by customer region for orders placed between two dates. It leaves out cancelled orders and reports, for each region, the number of distinct orders and the gross revenue (quantity times unit price). Orders with no region are grouped under \"Unassigned\".", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1884, "output_tokens": 2750, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.001563}], "cost_usd": 0.001563, "legacy_sql": "CREATE PROCEDURE Sales.uspSalesByRegion\n    @StartDate DATE,\n    @EndDate DATE\nAS\nBEGIN\n    SET NOCOUNT ON;\n    SELECT ISNULL(c.Region, 'Unassigned') AS Region,\n           COUNT(DISTINCT o.OrderID) AS Orders,\n           SUM(l.Quantity * l.UnitPrice) AS GrossRevenue\n    FROM Sales.Orders o\n    JOIN dbo.Customers c ON c.CustomerID = o.CustomerID\n    JOIN Sales.OrderLines l ON l.OrderID = o.OrderID\n    WHERE o.OrderDate BETWEEN @StartDate AND @EndDate\n      AND o.Status <> 'cancelled'\n    GROUP BY ISNULL(c.Region, 'Unassigned');\nEND\n", "name": "005_uspsalesbyregion"}, {"id": 6, "slug": "usptopproducts", "difficulty": "unknown", "tags": [], "status": "verified", "attempts": 1, "rows": 32, "datasets": {"base": 8, "seed_101": 8, "seed_202": 8, "edge": 8}, "param_sets": 4, "model_sql": "WITH sales AS (\n    SELECT\n        p.ProductID,\n        p.ProductName,\n        p.Category,\n        SUM(l.Quantity) AS UnitsSold\n    FROM {{ source('legacy', 'Products') }} p\n    JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n        ON l.ProductID = p.ProductID\n    GROUP BY p.ProductID, p.ProductName, p.Category\n),\nranked AS (\n    SELECT\n        ProductID,\n        ProductName,\n        Category,\n        UnitsSold,\n        lower(rtrim(Category)) AS category_key,\n        ROW_NUMBER() OVER (ORDER BY UnitsSold DESC, ProductID) AS rank_all,\n        ROW_NUMBER() OVER (PARTITION BY lower(rtrim(Category)) ORDER BY UnitsSold DESC, ProductID) AS rank_in_category\n    FROM sales\n)\nSELECT\n    ProductID,\n    ProductName,\n    Category,\n    UnitsSold,\n    category_key,\n    rank_all,\n    rank_in_category\nFROM ranked", "param_filter": "(@Category IS NULL AND rank_all <= @TopN) OR (@Category IS NOT NULL AND category_key = lower(rtrim(@Category)) AND rank_in_category <= @TopN)", "history": [{"attempt": 1, "sql": "WITH sales AS (\n    SELECT\n        p.ProductID,\n        p.ProductName,\n        p.Category,\n        SUM(l.Quantity) AS UnitsSold\n    FROM {{ source('legacy', 'Products') }} p\n    JOIN {{ source('legacy', 'Sales_OrderLines') }} l\n        ON l.ProductID = p.ProductID\n    GROUP BY p.ProductID, p.ProductName, p.Category\n),\nranked AS (\n    SELECT\n        ProductID,\n        ProductName,\n        Category,\n        UnitsSold,\n        lower(rtrim(Category)) AS category_key,\n        ROW_NUMBER() OVER (ORDER BY UnitsSold DESC, ProductID) AS rank_all,\n        ROW_NUMBER() OVER (PARTITION BY lower(rtrim(Category)) ORDER BY UnitsSold DESC, ProductID) AS rank_in_category\n    FROM sales\n)\nSELECT\n    ProductID,\n    ProductName,\n    Category,\n    UnitsSold,\n    category_key,\n    rank_all,\n    rank_in_category\nFROM ranked", "param_filter": "(@Category IS NULL AND rank_all <= @TopN) OR (@Category IS NOT NULL AND category_key = lower(rtrim(@Category)) AND rank_in_category <= @TopN)", "status": "match", "detail": {"runs": 16, "rows": 32}}], "explanation": "This procedure returns the top N products by total units sold, based on order lines, and can optionally be limited to one product category. Products are ranked by units sold (ties broken by ProductID), and only the first N rows are returned. When a category is supplied, the ranking is done within that category only.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1839, "output_tokens": 2162, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.001265}], "cost_usd": 0.001265, "legacy_sql": "CREATE PROCEDURE Sales.uspTopProducts\n    @TopN INT = 5,\n    @Category VARCHAR(30) = NULL\nAS\nBEGIN\n    SET NOCOUNT ON;\n    SELECT TOP (@TopN) p.ProductID, p.ProductName, p.Category, SUM(l.Quantity) AS UnitsSold\n    FROM dbo.Products p\n    JOIN Sales.OrderLines l ON l.ProductID = p.ProductID\n    WHERE @Category IS NULL OR p.Category = @Category\n    GROUP BY p.ProductID, p.ProductName, p.Category\n    ORDER BY SUM(l.Quantity) DESC, p.ProductID;\nEND\n", "name": "006_usptopproducts"}];const ok=R.filter(r=>r.status=='verified'),hu=R.filter(r=>r.status!='verified');

${['assumptions','questions','not_migrated'].filter(k=>r.proposal[k]).map(k=>`<h4>${{assumptions:'Assumptions',questions:'Questions for the reviewer',not_migrated:'Not migrated'}[k]}</h4><pre style="white-space:pre-wrap">${esc(r.proposal[k])}</pre>`).join('')}</div>`:''}
${r.history&&r.history.length>1?`<div style="grid-column:1/-1"><h4>Attempt history</h4>${r.history.map(h=>`<p class=mut style="margin:2px 0">#${h.attempt} ${esc(h.status)}${h.status=='match'?'':': '+esc(typeof h.detail=='string'?h.detail.slice(0,240):JSON.stringify(h.detail.issues).slice(0,240))}</p>`).join('')}</div>`:''}
<div><h4>Legacy T-SQL</h4><pre>${esc(r.legacy_sql)}</pre></div><div><h4>dbt model</h4><pre>${r.model_sql?esc(r.model_sql):'(none: not auto-migratable)'}</pre>${r.param_filter?`<h4>Parameter filter</h4><pre style="white-space:pre-wrap">${esc(r.param_filter)}</pre>`:''}</div></div></details>`}
function draw(){const list=R.filter(r=>f=='all'||(f=='verified'?r.status=='verified':f=='human'?r.status!='verified':r.difficulty==f));
document.getElementById('app').innerHTML=`<h1><b>${ok.length} of ${R.length}</b> procedures migrated, verified equivalent</h1>
<p class=sub>${hu.length} need a human. Each dbt model ran on the same 4 datasets as the original T-SQL proc (base, two random seeds, and an edge-case set), with every parameter set, and matched row by row on every run.</p>
<div class=bar><i style="width:${pct(ok.length)};background:var(--ok)"></i><i style="width:${pct(hu.length)};background:var(--warn)"></i></div>
<div class=legend><span>Verified ${ok.length}</span><span>Needs human ${hu.length}</span></div>
<div class=stats><div class=stat><b>${ok.reduce((a,r)=>a+r.rows,0)}</b><span>rows compared</span></div><div class=stat><b>${ok.filter(r=>r.attempts==1).length}</b><span>passed first try</span></div><div class=stat><b>${ok.filter(r=>r.attempts>1).length}</b><span>fixed by retry</span></div><div class=stat><b>$${R.reduce((a,r)=>a+(r.cost_usd||0),0).toFixed(3)}</b><span>LLM cost, full run</span></div></div>
<div class=human><h2>Needs a human (${hu.length})</h2>${hu.map(r=>`<p><b>${esc(r.name)}</b>: ${esc(r.reason)}${r.proposal?` <span class=mut>Proposal ready: ${esc(r.proposal.verification)}.</span>`:''}</p>`).join('')}</div>
<div class=filters>${['all','verified','human',...diffs.slice(0,3)].map(x=>`<button class="${f==x?'on':''}" onclick="f='${x}';draw()">${x}</button>`).join('')}</div>${list.map(row).join('')}`}
draw();</script></html>
