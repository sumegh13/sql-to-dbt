d": 0.00092}], "cost_usd": 0.00092, "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_top_products_by_revenue\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.top_products_by_revenue') IS NOT NULL DROP TABLE dbo.top_products_by_revenue;\nSELECT TOP 5 p.product_id, p.product_name, SUM(i.qty * i.unit_price) AS revenue INTO dbo.top_products_by_revenue\nFROM dbo.order_items i JOIN dbo.products p ON p.product_id = i.product_id\nGROUP BY p.product_id, p.product_name ORDER BY SUM(i.qty * i.unit_price) DESC, p.product_id;\nEND\n", "name": "004_top_products_by_revenue"}, {"id": 5, "slug": "customer_email_domains", "difficulty": "easy", "tags": ["string-functions"], "status": "verified", "attempts": 1, "rows": 13, "datasets": {"base": 3, "seed_101": 3, "seed_202": 3, "edge": 4}, "model_sql": "WITH parsed AS (\n    SELECT\n        substr(\n            email,\n            instr(email, '@') + 1,\n            length(rtrim(email))\n        ) AS domain\n    FROM {{ source('legacy', 'customers') }}\n    WHERE email IS NOT NULL\n)\nSELECT\n    min(domain) AS domain,\n    count(*) AS customers\nFROM parsed\nGROUP BY rtrim(lower(domain))", "history": [{"attempt": 1, "sql": "WITH parsed AS (\n    SELECT\n        substr(\n            email,\n            instr(email, '@') + 1,\n            length(rtrim(email))\n        ) AS domain\n    FROM {{ source('legacy', 'customers') }}\n    WHERE email IS NOT NULL\n)\nSELECT\n    min(domain) AS domain,\n    count(*) AS customers\nFROM parsed\nGROUP BY rtrim(lower(domain))", "status": "match", "detail": {"datasets": {"base": 3, "seed_101": 3, "seed_202": 3, "edge": 4}}}], "explanation": "This procedure takes every customer with a non-null email address and extracts the part after the \"@\" sign, which is the email domain. It then counts how many customers use each domain and saves the result as a summary table. The rewrite reproduces SQL Server's case-insensitive, trailing-space-insensitive grouping so domains like \"Gmail.com\" and \"gmail.com eed_202": 34, "edge": 15}}}], "explanation": "This procedure builds a payment status report with one row per order. For each order, it adds up all payments recorded against it, treating orders with no payments as zero paid. It then labels each order \"paid\" if payments cover the order amount, \"partial\" if some money has been paid but not enough, and \"unpaid\" otherwise.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1579, "output_tokens": 988, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.000652}], "cost_usd": 0.000652, "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_payment_status\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.payment_status') IS NOT NULL DROP TABLE dbo.payment_status;\nSELECT o.order_id, o.amount, ISNULL(SUM(p.paid_amount),0) AS paid,\n  CASE WHEN ISNULL(SUM(p.paid_amount),0) >= o.amount THEN 'paid'\n       WHEN ISNULL(SUM(p.paid_amount),0) > 0 THEN 'partial' ELSE 'unpaid' END AS payment_status\nINTO dbo.payment_status FROM dbo.orders o LEFT JOIN dbo.payments p ON p.order_id = o.order_id\nGROUP BY o.order_id, o.amount;\nEND\n", "name": "007_payment_status"}, {"id": 8, "slug": "avg_item_by_category", "difficulty": "medium", "tags": ["decimal-avg"], "status": "verified", "attempts": 2, "rows": 12, "datasets": {"base": 3, "seed_101": 3, "seed_202": 3, "edge": 3}, "model_sql": "WITH lines AS (\n    SELECT\n        p.category,\n        CAST(CAST(i.qty AS DECIMAL(18,0)) * CAST(i.unit_price AS DECIMAL(18,2)) AS DECIMAL(38,2)) AS line_value\n    FROM {{ source('legacy', 'order_items') }} i\n    JOIN {{ source('legacy', 'products') }} p\n        ON p.product_id = i.product_id\n),\nagg AS (\n    SELECT\n        LOWER(category) AS category_key,\n        MIN(category) AS category,\n        SUM(line_value) AS line_sum,\n        COUNT(line_value) AS non_null_lines,\n        COUNT(*) AS line_count\n    FROM lines\n    GROUP BY LOWER(category)\n)\nSELECT\n    category,\n    CAST(\n        (CAST(line_sum * 1000000 AS HU employees') }}\n),\nranked AS (\n    SELECT\n        employee_id,\n        emp_name,\n        department,\n        salary,\n        sal_c,\n        DENSE_RANK() OVER (PARTITION BY dept_key ORDER BY salary DESC) AS dept_rank,\n        SUM(sal_c) OVER (PARTITION BY dept_key) AS tot_c\n    FROM base\n),\ncalc AS (\n    SELECT\n        employee_id,\n        emp_name,\n        department,\n        salary,\n        dept_rank,\n        CASE\n            WHEN tot_c = 0 THEN NULL\n            ELSE (CASE WHEN (sal_c < 0) <> (tot_c < 0) THEN -1 ELSE 1 END)\n                 * ((20000 * ABS(sal_c) + ABS(tot_c)) // (2 * ABS(tot_c)))\n        END AS hund\n    FROM ranked\n)\nSELECT\n    employee_id,\n    emp_name,\n    department,\n    salary,\n    dept_rank,\n    CAST(CAST(hund AS DECIMAL(18, 0)) * CAST(0.01 AS DECIMAL(3, 2)) AS DECIMAL(5, 2)) AS pct_of_dept\nFROM calc", "history": [{"attempt": 1, "sql": "WITH base AS (\n    SELECT\n        employee_id,\n        emp_name,\n        department,\n        salary,\n        RTRIM(LOWER(department)) AS dept_key,\n        CAST(salary * 100 AS BIGINT) AS sal_c\n    FROM {{ source('legacy', 'employees') }}\n),\nranked AS (\n    SELECT\n        employee_id,\n        emp_name,\n        department,\n        salary,\n        sal_c,\n        DENSE_RANK() OVER (PARTITION BY dept_key ORDER BY salary DESC) AS dept_rank,\n        SUM(sal_c) OVER (PARTITION BY dept_key) AS tot_c\n    FROM base\n),\ncalc AS (\n    SELECT\n        employee_id,\n        emp_name,\n        department,\n        salary,\n        dept_rank,\n        CASE\n            WHEN tot_c = 0 THEN NULL\n            ELSE (CASE WHEN (sal_c < 0) <> (tot_c < 0) THEN -1 ELSE 1 END)\n                 * ((20000 * ABS(sal_c) + ABS(tot_c)) // (2 * ABS(tot_c)))\n        END AS hund\n    FROM ranked\n)\nSELECT\n    employee_id,\n    emp_name,\n    department,\n    salary,\n    dept_rank,\n    CAST(CAST(hund AS DECIMAL(18, 0)) * CAST(0.01 AS DECIMAL(3, 2)) AS DECIMAL(5, 2)) AS pct_of_dept\nFROM calc", "status": "match", "detail": {"datasets": {"base": 10, "seed_101": 10, "seed_202": 10, "edge": 6}}}], "explanation": "This procedure builds a salary report for every employee, showing their rank by salary within their department (1 for the highest salary, with ties sharing a rank) and their salary as a percentage of the department's total payroll, rounded to two decimals. The model reproduces that in one query, with the department grouping matched the way SQL Server's case-insensitive collation matches it. The percentage is calculated with integer cent arithmetic so that the rounding matches SQL Server's CAST to DECIMAL(5,2) exactly.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1544, "output_tokens": 4261, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.002285}], "cost_usd": 0.002285, "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_dept_salary_rank\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.dept_salary_rank') IS NOT NULL DROP TABLE dbo.dept_salary_rank;\nSELECT employee_id, emp_name, department, salary,\n  DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS dept_rank,\n  CAST(salary * 100.0 / SUM(salary) OVER (PARTITION BY department) AS DECIMAL(5,2)) AS pct_of_dept\nINTO dbo.dept_salary_rank FROM dbo.employees;\nEND\n", "name": "046_dept_salary_rank"}, {"id": 47, "slug": "product_cross_sell", "difficulty": "medium", "tags": ["self-join"], "status": "verified", "attempts": 1, "rows": 78, "datasets": {"base": 27, "seed_101": 26, "seed_202": 23, "edge": 2}, "model_sql": "select\n    a.product_id as product_a,\n    b.product_id as product_b,\n    count(distinct a.order_id) as together\nfrom {{ source('legacy', 'order_items') }} a\njoin {{ source('legacy', 'order_items') }} b\n    on a.order_id = b.order_id\n    and a.product_id < b.product_id\ngroup by a.product_id, b.product_id", "history": [{"attempt": 1, "sql": "select\n    a.product_id as product_a,\n    b.product_id as product_b,\n    count(distinct a.order_id) as together\nfrom {{ source('legacy', 'order_items') }} a\njoin {{ source('legacy', 'order_items') }} b\n    on a.order_id = b.order_id\n    and a.product_id < b.product_id\ngroup by a.product_id, b.product_id", "status": "match", "detail": {"datasets": {"base": 27, "seed_101": 26, "seed_202": 23, "edge": 2}}}], "explanation": "This procedure finds pairs of products that appear together in the same order. For each pair of different products, it counts how many distinct orders contain both, and stores the result as a cross-sell table. Each pair is listed once, with the lower product ID in the first column.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1505, "output_tokens": 541, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.000421}], "cost_usd": 0.000421, "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_product_cross_sell\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.product_cross_sell') IS NOT NULL DROP TABLE dbo.product_cross_sell;\nSELECT a.product_id AS product_a, b.product_id AS product_b, COUNT(DISTINCT a.order_id) AS together\nINTO dbo.product_cross_sell FROM dbo.order_items a JOIN dbo.order_items b ON a.order_id = b.order_id AND a.product_id < b.product_id\nGROUP BY a.product_id, b.product_id;\nEND\n", "name": "047_product_cross_sell"}, {"id": 48, "slug": "dynamic_sql_report", "difficulty": "human", "tags": ["dynamic-sql"], "status": "needs_human", "reason_category": "dynamic_sql", "reason": "Builds SQL at runtime; the real query shape is only known by executing it. Needs a human to pin down the intended static SQL.", "attempts": 1, "history": [{"attempt": 1, "sql": "SELECT\n    c.customer_id,\n    c.customer_name,\n    c.region,\n    c.signup_date,\n    c.email,\n    c.is_active,\n    c.legacy_code,\n    c.tags\nFROM {{ source('legacy', 'customers') }} AS c\nWHERE c.email IS NOT NULL", "status": "match", "detail": {"datasets": {"base": 10, "seed_101": 10, "seed_202": 10, "edge": 6}}}], "model_sql": "SELECT\n    c.customer_id,\n    c.customer_name,\n    c.region,\n    c.signup_date,\n    c.email,\n    c.is_active,\n    c.legacy_code,\n    c.tags\nFROM {{ source('legacy', 'customers') }} AS c\nWHERE c.email IS NOT NULL", "proposal": {"model_sql": "SELECT\n    c.customer_id,\n    c.customer_name,\n    c.region,\n    c.signup_date,\n    c.email,\n    c.is_active,\n    c.legacy_code,\n    c.tags\nFROM {{ source('legacy', 'customers') }} AS c\nWHERE c.email IS NOT NULL", "assumptions": "- The report_config row currently reads ('customers', 'email'), and that is the only row. The model hardcodes this pair because a dbt model cannot build table or column names at runtime.\n- \"IS NOT NULL\" is the only filter applied. Empty strings are kept, which matches T-SQL behaviour here.\n- SELECT TOP 1 with no ORDER BY is harmless because report_config has a single row.\n- The procedure's output columns are exactly the customers columns in their declared order, so the model lists them explicitly rather than using SELECT *.\n- dbo.customer_staging is not read by the procedure, so its contents do not affect the output.\n- Column types carry over from the source through SELECT * INTO, and the model keeps the same types.", "questions": "- Is the intended report fixed to customers filtered by email, or should the config row be treated as a live input? If it is live, the procedure cannot be reproduced as a static model and the intended query shape must be specified.\n- If report_config ever changes, should this model be rewritten to match, or should the procedure be retired?\n- Should rows where email is an empty or whitespace-only string also be excluded? The procedure does not exclude them.\n- Is the output table expected to be overwritten on each run (as the procedure does), or should history be kept?", "not_migrated": "- The procedure drops and recreates dbo.dynamic_sql_report on every run. The dbt model does not write a table itself; materialisation is handled by dbt config.\n- Dynamic SQL: the table name, filter column, and their quoting are resolved from report_config at execution time. This is replaced by a hardcoded customers/email filter, so changes to report_config have no effect on the model.\n- The procedure's SET NOCOUNT ON has no equivalent in the model.", "verification": "output rows match on 4 datasets"}, "explanation": "The procedure reads a configuration table to find which table to report on and which column to filter by. At present that config points to the customers table, filtered on email. The procedure copies every customer row where the email is present into a report table, replacing the previous run's output. This model reproduces that output for the current configuration by selecting the customers columns where email is not null.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1986, "output_tokens": 1274, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.000836}], "cost_usd": 0.000836, "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_dynamic_sql_report\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.dynamic_sql_report') IS NOT NULL DROP TABLE dbo.dynamic_sql_report;\nDECLARE @tbl SYSNAME, @col SYSNAME, @sql NVARCHAR(MAX);\nSELECT TOP 1 @tbl = table_name, @col = filter_col FROM dbo.report_config;\nSET @sql = N'SELECT * INTO dbo.dynamic_sql_report FROM dbo.' + QUOTENAME(@tbl) + N' WHERE ' + QUOTENAME(@col) + N' IS NOT NULL';\nEXEC sp_executesql @sql;\nEND\n", "name": "048_dynamic_sql_report"}, {"id": 49, "slug": "random_audit_sample", "difficulty": "human", "tags": ["nondeterministic"], "status": "needs_human", "reason_category": "nondeterministic", "reason": "Output depends on time/randomness, so old-vs-new equivalence can't be proven row by row.", "attempts": 1, "history": [{"attempt": 1, "sql": "with ranked as (\n    select\n        customer_id,\n        customer_name,\n        row_number() over (order by customer_id) as rn\n    from {{ source('legacy', 'customers') }}\n)\nselect\n    customer_id,\n    customer_name,\n    md5(cast(customer_id as varchar)) as audit_token,\n    timestamp '1970-01-01 00:00:00' as sampled_at\nfrom ranked\nwhere rn <= 5", "status": "match", "detail": {"datasets": {"base": 5, "seed_101": 5, "seed_202": 5, "edge": 5}}}], "model_sql": "with ranked as (\n    select\n        customer_id,\n        customer_name,\n        row_number() over (order by customer_id) as rn\n    from {{ source('legacy', 'customers') }}\n)\nselect\n    customer_id,\n    customer_name,\n    md5(cast(customer_id as varchar)) as audit_token,\n    timestamp '1970-01-01 00:00:00' as sampled_at\nfrom ranked\nwhere rn <= 5", "proposal": {"model_sql": "with ranked as (\n    select\n        customer_id,\n        customer_name,\n        row_number() over (order by customer_id) as rn\n    from {{ source('legacy', 'customers') }}\n)\nselect\n    customer_id,\n    customer_name,\n    md5(cast(customer_id as varchar)) as audit_token,\n    timestamp '1970-01-01 00:00:00' as sampled_at\nfrom ranked\nwhere rn <= 5", "assumptions": "- Determinism: the five rows are the five customers with the lowest customer_id. This replaces the original ORDER BY NEWID(), so the same rows come back on every run. This is a fixed selection, not a random sample.\n- audit_token: md5 of the customer_id is a stable stand-in for NEWID(). It is a 32-character hex string, not a 36-character uniqueidentifier, so the type differs from the original.\n- sampled_at: a fixed placeholder timestamp replaces GETDATE(). The model has no run-time variable because Jinja beyond source() is not allowed.\n- customer_id is unique in dbo.customers. If it is not, the row_number tie-break is arbitrary and should be made deterministic on a unique key.\n- The source has at least five customers, so the output has five rows. With fewer, it returns all of them, as TOP 5 would.\n- Column names and order match the required output: customer_id, customer_name, audit_token, sampled_at.", "questions": "- Is a fixed selection (lowest five customer_id values) acceptable for an audit sample, or do auditors need a sample that changes between runs?\n- Should audit_token keep the uniqueidentifier format? If so, a deterministic GUID-shaped value (for example, built from md5 and formatted with dashes) would be needed.\n- Should sampled_at be the actual run time? That would make the model nondeterministic and would need a run-date variable, which the rules do not allow here.\n- Is customer_id unique in dbo.customers? If not, which column breaks ties?\n- Is the row count guaranteed to be five in production, or should the model handle smaller tables differently?\n- Does any downstream consumer rely on the table being a physical copy that is rebuilt each run?", "not_migrated": "- The DROP TABLE and SELECT INTO side effects are not reproduced. The model is a SELECT only, and dbt handles materialization. The table is rebuilt by dbt, not by the procedure.\n- SET NOCOUNT ON has no equivalent and is not needed.\n- The random selection (ORDER BY NEWID()) is not reproduced; it is replaced by a fixed choice, as described in the assumptions.\n- GETDATE() and NEWID() are not reproduced. Their values are replaced by a fixed timestamp and an md5 hash.", "verification": "shape only (columns + row count) on 4 datasets"}, "explanation": "The procedure drops and rebuilds dbo.random_audit_sample with five customers chosen at random from dbo.customers, each tagged with a random GUID and the current time. It is a quality-control sample meant for auditors to review, so each run gives a different set of customers. This model keeps the same shape (five customers, same columns) but makes the choice fixed so the output can be reproduced.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1877, "output_tokens": 1956, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.001166}], "cost_usd": 0.001166, "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_random_audit_sample\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.random_audit_sample') IS NOT NULL DROP TABLE dbo.random_audit_sample;\nSELECT TOP 5 customer_id, customer_name, NEWID() AS audit_token, GETDATE() AS sampled_at\nINTO dbo.random_audit_sample FROM dbo.customers ORDER BY NEWID();\nEND\n", "name": "049_random_audit_sample"}, {"id": 50, "slug": "archive_and_purge", "difficulty": "human", "tags": ["mutates-source"], "status": "needs_human", "reason_category": "mutates_source", "reason": "Modifies existing tables in place (dbo.customers, dbo.orders); a dbt model can only build new relations, so this needs a design decision (incremental/snapshot/ops job).", "attempts": 1, "history": [{"attempt": 1, "sql": "select\n    order_id,\n    customer_id,\n    order_date,\n    amount,\n    status\nfrom {{ source('legacy', 'orders') }}\nwhere rtrim(lower(status)) = 'cancelled'\n  and order_date < DATE '2025-10-01'", "status": "match", "detail": {"datasets": {"base": 2, "seed_101": 0, "seed_202": 2, "edge": 1}}}], "model_sql": "select\n    order_id,\n    customer_id,\n    order_date,\n    amount,\n    status\nfrom {{ source('legacy', 'orders') }}\nwhere rtrim(lower(status)) = 'cancelled'\n  and order_date < DATE '2025-10-01'", "proposal": {"model_sql": "select\n    order_id,\n    customer_id,\n    order_date,\n    amount,\n    status\nfrom {{ source('legacy', 'orders') }}\nwhere rtrim(lower(status)) = 'cancelled'\n  and order_date < DATE '2025-10-01'", "assumptions": "- The output table is the archive, so the model reproduces only `dbo.archive_and_purge`. The DELETE and UPDATE side effects are not part of the model.\n- T-SQL's default case-insensitive collation is emulated with `lower()`, so 'Cancelled' and 'CANCELLED' match. T-SQL also ignores trailing spaces in equality, which `rtrim()` emulates. The source collation is assumed to be accent-sensitive (the usual `_CI_AS` default), so no accent folding is applied.\n- `order_date` is a DATE column, so comparing it to `DATE '2025-10-01'` matches the T-SQL string-literal comparison.\n- The source `dbo.orders` still contains the cancelled rows when the model runs. The model is only correct if it runs before the procedure's DELETE has taken effect.\n- Duplicate rows are preserved (no DISTINCT), matching SELECT * INTO.\n- NULL status values are excluded, as they are in T-SQL, because NULL = 'cancelled' is not true.", "questions": "- Ordering: does the dbt model run before the purge? Once the procedure's DELETE has run, `dbo.orders` no longer holds these rows, so a dbt model reading it afterward would return zero rows. Which system is the source of truth, and what is the run order?\n- Should the archive be append-only (incremental, with a unique key on order_id) or rebuilt each run? If it is rebuilt from orders, the archive is lost once the source rows are purged.\n- Should the purge (DELETE from orders) be kept in the warehouse, or moved to an ops job outside dbt? dbt models cannot delete rows from a source table.\n- Should the customer deactivation (UPDATE customers SET is_active = 0 for customers with no orders) be modeled as a snapshot or a separate model? Note that it depends on orders after the purge, so its result differs depending on run order.\n- Are status values with leading spaces, or other variants such as 'canceled' (US spelling), expected to match? The current logic matches only 'cancelled' with trailing spaces trimmed.\n- Is the 2025-10-01 cutoff meant to stay hard-coded, or should it become a dbt variable?", "not_migrated": "- DELETE FROM dbo.orders for the archived order_ids. A dbt model cannot modify a source table.\n- UPDATE dbo.customers SET is_active = 0 for customers with no rows in orders. This is an in-place mutation of a source table and is not reproduced.\n- The DROP TABLE / recreate of dbo.archive_and_purge. The model is a SELECT; materialization (table, incremental, or otherwise) is left to dbt config and the design decision noted in the questions.\n- The SET NOCOUNT ON and procedure wrapper have no equivalent in the model.", "verification": "output rows match on 4 datasets"}, "explanation": "This procedure copies every cancelled order dated before 1 October 2025 into a separate archive table, then deletes those orders from the live orders table. It also marks as inactive any customer who has no remaining orders. The model below reproduces only the archive table: the cancelled, pre-October orders as they existed before the purge.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1958, "output_tokens": 1899, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.001145}], "cost_usd": 0.001145, "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_archive_and_purge\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.archive_and_purge') IS NOT NULL DROP TABLE dbo.archive_and_purge;\nSELECT * INTO dbo.archive_and_purge FROM dbo.orders WHERE status = 'cancelled' AND order_date < '2025-10-01';\nDELETE FROM dbo.orders WHERE order_id IN (SELECT order_id FROM dbo.archive_and_purge);\nUPDATE dbo.customers SET is_active = 0 WHERE customer_id NOT IN (SELECT customer_id FROM dbo.orders);\nEND\n", "name": "050_archive_and_purge"}];const ok=R.filter(r=>r.status=='verified'),hu=R.filter(r=>r.status!='verified');
