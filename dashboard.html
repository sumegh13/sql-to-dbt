const R=[{"id": 1, "slug": "customer_order_totals", "difficulty": "medium", "tags": ["cursor"], "status": "verified", "attempts": 1, "rows": 12, "model_sql": "select c.customer_id, c.customer_name, count(o.order_id) as order_count,\n       coalesce(sum(o.amount), 0) as total_amount,\n       case when coalesce(sum(o.amount), 0) >= 1000 then 'gold'\n            when coalesce(sum(o.amount), 0) >= 500 then 'silver' else 'bronze' end as tier\nfrom {{ source('legacy', 'customers') }} c\nleft join {{ source('legacy', 'orders') }} o on o.customer_id = c.customer_id and lower(o.status) <> 'cancelled'\ngroup by c.customer_id, c.customer_name\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 12, "new_rows": 12, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_customer_order_totals\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.customer_order_totals') IS NOT NULL DROP TABLE dbo.customer_order_totals;\nCREATE TABLE dbo.customer_order_totals (customer_id INT, customer_name VARCHAR(100), order_count INT, total_amount DECIMAL(18,2), tier VARCHAR(10));\nDECLARE @id INT, @name VARCHAR(100), @cnt INT, @amt DECIMAL(18,2);\nDECLARE c CURSOR FOR SELECT customer_id, customer_name FROM dbo.customers;\nOPEN c; FETCH NEXT FROM c INTO @id, @name;\nWHILE @@FETCH_STATUS = 0\nBEGIN\n    SELECT @cnt = COUNT(*), @amt = ISNULL(SUM(amount),0) FROM dbo.orders WHERE customer_id=@id AND status<>'cancelled';\n    INSERT INTO dbo.customer_order_totals VALUES (@id,@name,@cnt,@amt,\n        CASE WHEN @amt>=1000 THEN 'gold' WHEN @amt>=500 THEN 'silver' ELSE 'bronze' END);\n    FETCH NEXT FROM c INTO @id, @name;\nEND\nCLOSE c; DEALLOCATE c;\nEND\n", "name": "001_customer_order_totals"}, {"id": 2, "slug": "active_customers_by_region", "difficulty": "easy", "tags": ["isnull", "group-by"], "status": "verified", "attempts": 1, "rows": 5, "model_sql": "select coalesce(region, 'Unknown') as region, count(*) as customer_count\nfrom {{ source('legacy', 'customers') }} where is_active = 1 group by 1\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 5, "new_rows": 5, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_active_customers_by_region\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.active_customers_by_region') IS NOT NULL DROP TABLE dbo.active_customers_by_region;\nSELECT ISNULL(region,'Unknown') AS region, COUNT(*) AS customer_count INTO dbo.active_customers_by_region\nFROM dbo.customers WHERE is_active = 1 GROUP BY ISNULL(region,'Unknown');\nEND\n", "name": "002_active_customers_by_region"}, {"id": 3, "slug": "monthly_revenue", "difficulty": "easy", "tags": ["case-insensitive-collation", "datepart"], "status": "verified", "attempts": 1, "rows": 4, "model_sql": "select year(order_date) as yr, month(order_date) as mo, sum(amount) as revenue\nfrom {{ source('legacy', 'orders') }} where lower(status) not in ('cancelled','returned') group by 1, 2\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 4, "new_rows": 4, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_monthly_revenue\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.monthly_revenue') IS NOT NULL DROP TABLE dbo.monthly_revenue;\nSELECT YEAR(order_date) AS yr, MONTH(order_date) AS mo, SUM(amount) AS revenue INTO dbo.monthly_revenue\nFROM dbo.orders WHERE status NOT IN ('cancelled','returned') GROUP BY YEAR(order_date), MONTH(order_date);\nEND\n", "name": "003_monthly_revenue"}, {"id": 4, "slug": "top_products_by_revenue", "difficulty": "easy", "tags": ["top-n"], "status": "verified", "attempts": 1, "rows": 5, "model_sql": "select p.product_id, p.product_name, sum(i.qty * i.unit_price) as revenue\nfrom {{ source('legacy', 'order_items') }} i join {{ source('legacy', 'products') }} p on p.product_id = i.product_id\ngroup by 1, 2 order by revenue desc, p.product_id limit 5\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 5, "new_rows": 5, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_top_products_by_revenue\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.top_products_by_revenue') IS NOT NULL DROP TABLE dbo.top_products_by_revenue;\nSELECT TOP 5 p.product_id, p.product_name, SUM(i.qty * i.unit_price) AS revenue INTO dbo.top_products_by_revenue\nFROM dbo.order_items i JOIN dbo.products p ON p.product_id = i.product_id\nGROUP BY p.product_id, p.product_name ORDER BY SUM(i.qty * i.unit_price) DESC, p.product_id;\nEND\n", "name": "004_top_products_by_revenue"}, {"id": 5, "slug": "customer_email_domains", "difficulty": "easy", "tags": ["string-functions"], "status": "verified", "attempts": 1, "rows": 3, "model_sql": "select split_part(email, '@', 2) as domain, count(*) as customers\nfrom {{ source('legacy', 'customers') }} where email is not null group by 1\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 3, "new_rows": 3, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_customer_email_domains\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.customer_email_domains') IS NOT NULL DROP TABLE dbo.customer_email_domains;\nSELECT SUBSTRING(email, CHARINDEX('@',email)+1, LEN(email)) AS domain, COUNT(*) AS customers INTO dbo.customer_email_domains\nFROM dbo.customers WHERE email IS NOT NULL GROUP BY SUBSTRING(email, CHARINDEX('@',email)+1, LEN(email));\nEND\n", "name": "005_customer_email_domains"}, {"id": 6, "slug": "order_age_buckets", "difficulty": "easy", "tags": ["datediff"], "status": "verified", "attempts": 1, "rows": 34, "model_sql": "select order_id, date_diff('day', order_date, date '2025-12-31') as age_days,\n  case when date_diff('day', order_date, date '2025-12-31') <= 30 then '0-30'\n       when date_diff('day', order_date, date '2025-12-31') <= 90 then '31-90' else '90+' end as bucket\nfrom {{ source('legacy', 'orders') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 34, "new_rows": 34, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_order_age_buckets\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.order_age_buckets') IS NOT NULL DROP TABLE dbo.order_age_buckets;\nSELECT order_id, DATEDIFF(day, order_date, '2025-12-31') AS age_days,\n  CASE WHEN DATEDIFF(day, order_date, '2025-12-31') <= 30 THEN '0-30'\n       WHEN DATEDIFF(day, order_date, '2025-12-31') <= 90 THEN '31-90' ELSE '90+' END AS bucket\nINTO dbo.order_age_buckets FROM dbo.orders;\nEND\n", "name": "006_order_age_buckets"}, {"id": 7, "slug": "payment_status", "difficulty": "easy", "tags": ["left-join"], "status": "verified", "attempts": 1, "rows": 34, "model_sql": "select o.order_id, o.amount, coalesce(sum(p.paid_amount), 0) as paid,\n  case when coalesce(sum(p.paid_amount), 0) >= o.amount then 'paid'\n       when coalesce(sum(p.paid_amount), 0) > 0 then 'partial' else 'unpaid' end as payment_status\nfrom {{ source('legacy', 'orders') }} o left join {{ source('legacy', 'payments') }} p on p.order_id = o.order_id\ngroup by o.order_id, o.amount\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 34, "new_rows": 34, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_payment_status\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.payment_status') IS NOT NULL DROP TABLE dbo.payment_status;\nSELECT o.order_id, o.amount, ISNULL(SUM(p.paid_amount),0) AS paid,\n  CASE WHEN ISNULL(SUM(p.paid_amount),0) >= o.amount THEN 'paid'\n       WHEN ISNULL(SUM(p.paid_amount),0) > 0 THEN 'partial' ELSE 'unpaid' END AS payment_status\nINTO dbo.payment_status FROM dbo.orders o LEFT JOIN dbo.payments p ON p.order_id = o.order_id\nGROUP BY o.order_id, o.amount;\nEND\n", "name": "007_payment_status"}, {"id": 8, "slug": "avg_item_by_category", "difficulty": "medium", "tags": ["decimal-avg"], "status": "verified", "attempts": 1, "rows": 3, "model_sql": "select p.category, avg(i.qty * i.unit_price) as avg_line_value, count(*) as line_count\nfrom {{ source('legacy', 'order_items') }} i join {{ source('legacy', 'products') }} p on p.product_id = i.product_id group by 1\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 3, "new_rows": 3, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_avg_item_by_category\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.avg_item_by_category') IS NOT NULL DROP TABLE dbo.avg_item_by_category;\nSELECT p.category, AVG(i.qty * i.unit_price) AS avg_line_value, COUNT(*) AS line_count INTO dbo.avg_item_by_category\nFROM dbo.order_items i JOIN dbo.products p ON p.product_id = i.product_id GROUP BY p.category;\nEND\n", "name": "008_avg_item_by_category"}, {"id": 9, "slug": "cancel_pct_int_division", "difficulty": "medium", "tags": ["integer-division"], "status": "verified", "attempts": 1, "rows": 10, "model_sql": "select customer_id, count(*) as total_orders,\n  sum(case when lower(status) = 'cancelled' then 1 else 0 end) as cancelled_orders,\n  sum(case when lower(status) = 'cancelled' then 1 else 0 end) * 100 // count(*) as cancel_pct\nfrom {{ source('legacy', 'orders') }} group by customer_id\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 10, "new_rows": 10, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_cancel_pct_int_division\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.cancel_pct_int_division') IS NOT NULL DROP TABLE dbo.cancel_pct_int_division;\nSELECT customer_id, COUNT(*) AS total_orders,\n  SUM(CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END) AS cancelled_orders,\n  SUM(CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END) * 100 / COUNT(*) AS cancel_pct\nINTO dbo.cancel_pct_int_division FROM dbo.orders GROUP BY customer_id;\nEND\n", "name": "009_cancel_pct_int_division"}, {"id": 10, "slug": "customers_without_orders", "difficulty": "easy", "tags": ["not-exists"], "status": "verified", "attempts": 1, "rows": 2, "model_sql": "select c.customer_id, c.customer_name from {{ source('legacy', 'customers') }} c\nwhere not exists (select 1 from {{ source('legacy', 'orders') }} o where o.customer_id = c.customer_id)\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 2, "new_rows": 2, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_customers_without_orders\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.customers_without_orders') IS NOT NULL DROP TABLE dbo.customers_without_orders;\nSELECT c.customer_id, c.customer_name INTO dbo.customers_without_orders FROM dbo.customers c\nWHERE NOT EXISTS (SELECT 1 FROM dbo.orders o WHERE o.customer_id = c.customer_id);\nEND\n", "name": "010_customers_without_orders"}, {"id": 11, "slug": "employee_salary_bands", "difficulty": "easy", "tags": ["iif"], "status": "verified", "attempts": 1, "rows": 10, "model_sql": "select employee_id, emp_name, salary,\n  case when salary >= 120000 then 'senior' when salary >= 70000 then 'mid' else 'junior' end as band\nfrom {{ source('legacy', 'employees') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 10, "new_rows": 10, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_employee_salary_bands\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.employee_salary_bands') IS NOT NULL DROP TABLE dbo.employee_salary_bands;\nSELECT employee_id, emp_name, salary, IIF(salary >= 120000, 'senior', IIF(salary >= 70000, 'mid', 'junior')) AS band\nINTO dbo.employee_salary_bands FROM dbo.employees;\nEND\n", "name": "011_employee_salary_bands"}, {"id": 12, "slug": "inventory_low_stock", "difficulty": "easy", "tags": ["left-join", "iif"], "status": "verified", "attempts": 1, "rows": 10, "model_sql": "select p.product_id, p.product_name, sum(inv.qty_on_hand) as total_qty,\n  case when sum(inv.qty_on_hand) < 20 then 1 else 0 end as low_stock\nfrom {{ source('legacy', 'products') }} p left join {{ source('legacy', 'inventory') }} inv on inv.product_id = p.product_id\ngroup by 1, 2\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 10, "new_rows": 10, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_inventory_low_stock\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.inventory_low_stock') IS NOT NULL DROP TABLE dbo.inventory_low_stock;\nSELECT p.product_id, p.product_name, SUM(inv.qty_on_hand) AS total_qty,\n  IIF(SUM(inv.qty_on_hand) < 20, 1, 0) AS low_stock\nINTO dbo.inventory_low_stock FROM dbo.products p LEFT JOIN dbo.inventory inv ON inv.product_id = p.product_id\nGROUP BY p.product_id, p.product_name;\nEND\n", "name": "012_inventory_low_stock"}, {"id": 13, "slug": "order_product_list", "difficulty": "medium", "tags": ["string_agg"], "status": "verified", "attempts": 1, "rows": 34, "model_sql": "select o.order_id, string_agg(p.product_name, ', ' order by p.product_name) as products\nfrom {{ source('legacy', 'orders') }} o join {{ source('legacy', 'order_items') }} i on i.order_id = o.order_id\njoin {{ source('legacy', 'products') }} p on p.product_id = i.product_id group by o.order_id\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 34, "new_rows": 34, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_order_product_list\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.order_product_list') IS NOT NULL DROP TABLE dbo.order_product_list;\nSELECT o.order_id, STRING_AGG(p.product_name, ', ') WITHIN GROUP (ORDER BY p.product_name) AS products\nINTO dbo.order_product_list FROM dbo.orders o\nJOIN dbo.order_items i ON i.order_id = o.order_id JOIN dbo.products p ON p.product_id = i.product_id\nGROUP BY o.order_id;\nEND\n", "name": "013_order_product_list"}, {"id": 14, "slug": "buyers_by_region", "difficulty": "easy", "tags": ["count-distinct", "null-group"], "status": "verified", "attempts": 1, "rows": 5, "model_sql": "select c.region, count(distinct c.customer_id) as buyers\nfrom {{ source('legacy', 'customers') }} c join {{ source('legacy', 'orders') }} o on o.customer_id = c.customer_id group by c.region\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 5, "new_rows": 5, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_buyers_by_region\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.buyers_by_region') IS NOT NULL DROP TABLE dbo.buyers_by_region;\nSELECT c.region, COUNT(DISTINCT c.customer_id) AS buyers INTO dbo.buyers_by_region\nFROM dbo.customers c JOIN dbo.orders o ON o.customer_id = c.customer_id GROUP BY c.region;\nEND\n", "name": "014_buyers_by_region"}, {"id": 15, "slug": "latest_product_price", "difficulty": "medium", "tags": ["row_number", "cte"], "status": "verified", "attempts": 1, "rows": 10, "model_sql": "select product_id, price, effective_date from (\n  select product_id, price, effective_date,\n         row_number() over (partition by product_id order by effective_date desc) as rn\n  from {{ source('legacy', 'price_history') }} where effective_date <= date '2025-12-31') r\nwhere rn = 1\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 10, "new_rows": 10, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_latest_product_price\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.latest_product_price') IS NOT NULL DROP TABLE dbo.latest_product_price;\nWITH r AS (\n  SELECT product_id, price, effective_date, ROW_NUMBER() OVER (PARTITION BY product_id ORDER BY effective_date DESC) AS rn\n  FROM dbo.price_history WHERE effective_date <= '2025-12-31')\nSELECT product_id, price, effective_date INTO dbo.latest_product_price FROM r WHERE rn = 1;\nEND\n", "name": "015_latest_product_price"}, {"id": 16, "slug": "running_total_cursor", "difficulty": "hard", "tags": ["cursor", "running-total"], "status": "verified", "attempts": 1, "rows": 34, "model_sql": "select customer_id, order_id, order_date, amount,\n  sum(amount) over (partition by customer_id order by order_date, order_id rows between unbounded preceding and current row) as running_total\nfrom {{ source('legacy', 'orders') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 34, "new_rows": 34, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_running_total_cursor\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.running_total_cursor') IS NOT NULL DROP TABLE dbo.running_total_cursor;\nCREATE TABLE dbo.running_total_cursor (customer_id INT, order_id INT, order_date DATE, amount DECIMAL(18,2), running_total DECIMAL(18,2));\nDECLARE @cust INT, @oid INT, @dt DATE, @amt DECIMAL(18,2), @prev INT = NULL, @run DECIMAL(18,2) = 0;\nDECLARE c CURSOR FOR SELECT customer_id, order_id, order_date, amount FROM dbo.orders ORDER BY customer_id, order_date, order_id;\nOPEN c; FETCH NEXT FROM c INTO @cust, @oid, @dt, @amt;\nWHILE @@FETCH_STATUS = 0\nBEGIN\n    IF @prev IS NULL OR @prev <> @cust SET @run = 0;\n    SET @run = @run + @amt; SET @prev = @cust;\n    INSERT INTO dbo.running_total_cursor VALUES (@cust, @oid, @dt, @amt, @run);\n    FETCH NEXT FROM c INTO @cust, @oid, @dt, @amt;\nEND\nCLOSE c; DEALLOCATE c;\nEND\n", "name": "016_running_total_cursor"}, {"id": 17, "slug": "order_rank_per_customer", "difficulty": "medium", "tags": ["window-ranking"], "status": "verified", "attempts": 1, "rows": 34, "model_sql": "select order_id, customer_id, amount,\n  row_number() over (partition by customer_id order by amount desc, order_id) as rn,\n  rank() over (partition by customer_id order by amount desc) as rnk,\n  dense_rank() over (partition by customer_id order by amount desc) as drnk\nfrom {{ source('legacy', 'orders') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 34, "new_rows": 34, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_order_rank_per_customer\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.order_rank_per_customer') IS NOT NULL DROP TABLE dbo.order_rank_per_customer;\nSELECT order_id, customer_id, amount,\n  ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY amount DESC, order_id) AS rn,\n  RANK() OVER (PARTITION BY customer_id ORDER BY amount DESC) AS rnk,\n  DENSE_RANK() OVER (PARTITION BY customer_id ORDER BY amount DESC) AS drnk\nINTO dbo.order_rank_per_customer FROM dbo.orders;\nEND\n", "name": "017_order_rank_per_customer"}, {"id": 18, "slug": "temp_table_pipeline", "difficulty": "medium", "tags": ["temp-tables"], "status": "verified", "attempts": 1, "rows": 12, "model_sql": "with spend as (\n  select customer_id, sum(amount) as spend from {{ source('legacy', 'orders') }}\n  where lower(status) not in ('cancelled','returned') group by customer_id),\njoined as (\n  select c.customer_id, c.customer_name, coalesce(s.spend, 0) as spend\n  from {{ source('legacy', 'customers') }} c left join spend s on s.customer_id = c.customer_id)\nselect j.customer_id, j.customer_name, j.spend,\n  case when j.spend > (select avg(spend) from joined) then 'above_avg' else 'at_or_below_avg' end as vs_avg\nfrom joined j\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 12, "new_rows": 12, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_temp_table_pipeline\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.temp_table_pipeline') IS NOT NULL DROP TABLE dbo.temp_table_pipeline;\nSELECT customer_id, SUM(amount) AS spend INTO #spend FROM dbo.orders WHERE status NOT IN ('cancelled','returned') GROUP BY customer_id;\nSELECT c.customer_id, c.customer_name, ISNULL(s.spend, 0) AS spend INTO #joined FROM dbo.customers c LEFT JOIN #spend s ON s.customer_id = c.customer_id;\nSELECT j.customer_id, j.customer_name, j.spend,\n  CASE WHEN j.spend > (SELECT AVG(spend) FROM #joined) THEN 'above_avg' ELSE 'at_or_below_avg' END AS vs_avg\nINTO dbo.temp_table_pipeline FROM #joined j;\nEND\n", "name": "018_temp_table_pipeline"}, {"id": 19, "slug": "customer_spend_quartiles", "difficulty": "medium", "tags": ["ntile", "cte"], "status": "verified", "attempts": 1, "rows": 8, "model_sql": "with s as (select customer_id, sum(amount) as spend from {{ source('legacy', 'orders') }}\n           where lower(status) not in ('cancelled','returned') group by customer_id)\nselect customer_id, spend, ntile(4) over (order by spend desc, customer_id) as quartile from s\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 8, "new_rows": 8, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_customer_spend_quartiles\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.customer_spend_quartiles') IS NOT NULL DROP TABLE dbo.customer_spend_quartiles;\nWITH s AS (SELECT customer_id, SUM(amount) AS spend FROM dbo.orders WHERE status NOT IN ('cancelled','returned') GROUP BY customer_id)\nSELECT customer_id, spend, NTILE(4) OVER (ORDER BY spend DESC, customer_id) AS quartile\nINTO dbo.customer_spend_quartiles FROM s;\nEND\n", "name": "019_customer_spend_quartiles"}, {"id": 20, "slug": "merge_customer_dim", "difficulty": "hard", "tags": ["merge", "upsert"], "status": "verified", "attempts": 1, "rows": 14, "model_sql": "select coalesce(s.customer_id, t.customer_id) as customer_id,\n  case when s.customer_id is not null then s.customer_name else t.customer_name end as customer_name,\n  case when s.customer_id is not null then s.region else t.region end as region,\n  coalesce(s.email, t.email) as email\nfrom {{ source('legacy', 'customers') }} t full outer join {{ source('legacy', 'customer_staging') }} s on t.customer_id = s.customer_id\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 14, "new_rows": 14, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_merge_customer_dim\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.merge_customer_dim') IS NOT NULL DROP TABLE dbo.merge_customer_dim;\nSELECT customer_id, customer_name, region, email INTO #tgt FROM dbo.customers;\nMERGE #tgt AS t USING dbo.customer_staging AS s ON t.customer_id = s.customer_id\nWHEN MATCHED THEN UPDATE SET customer_name = s.customer_name, region = s.region, email = ISNULL(s.email, t.email)\nWHEN NOT MATCHED BY TARGET THEN INSERT (customer_id, customer_name, region, email) VALUES (s.customer_id, s.customer_name, s.region, s.email);\nSELECT * INTO dbo.merge_customer_dim FROM #tgt;\nEND\n", "name": "020_merge_customer_dim"}, {"id": 21, "slug": "price_scd2", "difficulty": "hard", "tags": ["scd2", "lead"], "status": "verified", "attempts": 1, "rows": 16, "model_sql": "select product_id, price, effective_date as valid_from,\n  coalesce(lead(effective_date) over (partition by product_id order by effective_date), date '9999-12-31') as valid_to,\n  case when lead(effective_date) over (partition by product_id order by effective_date) is null then 1 else 0 end as is_current\nfrom {{ source('legacy', 'price_history') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 16, "new_rows": 16, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_price_scd2\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.price_scd2') IS NOT NULL DROP TABLE dbo.price_scd2;\nSELECT product_id, price, effective_date AS valid_from,\n  ISNULL(LEAD(effective_date) OVER (PARTITION BY product_id ORDER BY effective_date), '9999-12-31') AS valid_to,\n  CASE WHEN LEAD(effective_date) OVER (PARTITION BY product_id ORDER BY effective_date) IS NULL THEN 1 ELSE 0 END AS is_current\nINTO dbo.price_scd2 FROM dbo.price_history;\nEND\n", "name": "021_price_scd2"}, {"id": 22, "slug": "order_streaks", "difficulty": "hard", "tags": ["gaps-and-islands"], "status": "verified", "attempts": 1, "rows": 30, "model_sql": "with d as (select distinct customer_id, order_date from {{ source('legacy', 'orders') }}),\ng as (select customer_id, order_date,\n        order_date - cast(row_number() over (partition by customer_id order by order_date) as integer) as grp from d)\nselect customer_id, min(order_date) as streak_start, max(order_date) as streak_end, count(*) as days\nfrom g group by customer_id, grp\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 30, "new_rows": 30, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_order_streaks\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.order_streaks') IS NOT NULL DROP TABLE dbo.order_streaks;\nWITH d AS (SELECT DISTINCT customer_id, order_date FROM dbo.orders),\ng AS (SELECT customer_id, order_date,\n        DATEADD(day, -ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date), order_date) AS grp FROM d)\nSELECT customer_id, MIN(order_date) AS streak_start, MAX(order_date) AS streak_end, COUNT(*) AS days\nINTO dbo.order_streaks FROM g GROUP BY customer_id, grp;\nEND\n", "name": "022_order_streaks"}, {"id": 23, "slug": "org_hierarchy", "difficulty": "hard", "tags": ["recursive-cte"], "status": "verified", "attempts": 1, "rows": 10, "model_sql": "with recursive h as (\n  select employee_id, emp_name, manager_id, 0 as lvl, cast(emp_name as varchar) as path\n  from {{ source('legacy', 'employees') }} where manager_id is null\n  union all\n  select e.employee_id, e.emp_name, e.manager_id, h.lvl + 1, h.path || ' > ' || e.emp_name\n  from {{ source('legacy', 'employees') }} e join h on e.manager_id = h.employee_id)\nselect employee_id, emp_name, lvl, path from h\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 10, "new_rows": 10, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_org_hierarchy\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.org_hierarchy') IS NOT NULL DROP TABLE dbo.org_hierarchy;\nWITH h AS (\n  SELECT employee_id, emp_name, manager_id, 0 AS lvl, CAST(emp_name AS VARCHAR(500)) AS path\n  FROM dbo.employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.employee_id, e.emp_name, e.manager_id, h.lvl + 1, CAST(h.path + ' > ' + e.emp_name AS VARCHAR(500))\n  FROM dbo.employees e JOIN h ON e.manager_id = h.employee_id)\nSELECT employee_id, emp_name, lvl, path INTO dbo.org_hierarchy FROM h;\nEND\n", "name": "023_org_hierarchy"}, {"id": 24, "slug": "daily_calendar_loop", "difficulty": "medium", "tags": ["while-loop", "calendar"], "status": "verified", "attempts": 1, "rows": 61, "model_sql": "select cast(d.d as date) as cal_date, count(o.order_id) as orders_placed\nfrom generate_series(date '2025-11-01', date '2025-12-31', interval 1 day) as d(d)\nleft join {{ source('legacy', 'orders') }} o on o.order_date = cast(d.d as date)\ngroup by 1\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 61, "new_rows": 61, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_daily_calendar_loop\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.daily_calendar_loop') IS NOT NULL DROP TABLE dbo.daily_calendar_loop;\nCREATE TABLE dbo.daily_calendar_loop (cal_date DATE, orders_placed INT);\nDECLARE @d DATE = '2025-11-01';\nWHILE @d <= '2025-12-31'\nBEGIN\n    INSERT INTO dbo.daily_calendar_loop SELECT @d, COUNT(*) FROM dbo.orders WHERE order_date = @d;\n    SET @d = DATEADD(day, 1, @d);\nEND\nEND\n", "name": "024_daily_calendar_loop"}, {"id": 25, "slug": "status_pivot", "difficulty": "medium", "tags": ["pivot", "case-insensitive-collation"], "status": "verified", "attempts": 1, "rows": 10, "model_sql": "select customer_id,\n  count(*) filter (where lower(status) = 'shipped') as shipped,\n  count(*) filter (where lower(status) = 'pending') as pending,\n  count(*) filter (where lower(status) = 'cancelled') as cancelled\nfrom {{ source('legacy', 'orders') }} group by customer_id\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 10, "new_rows": 10, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_status_pivot\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.status_pivot') IS NOT NULL DROP TABLE dbo.status_pivot;\nSELECT customer_id, ISNULL([shipped],0) AS shipped, ISNULL([pending],0) AS pending, ISNULL([cancelled],0) AS cancelled\nINTO dbo.status_pivot FROM (SELECT customer_id, status, order_id FROM dbo.orders) src\nPIVOT (COUNT(order_id) FOR status IN ([shipped],[pending],[cancelled])) p;\nEND\n", "name": "025_status_pivot"}, {"id": 26, "slug": "inventory_pivot", "difficulty": "medium", "tags": ["pivot"], "status": "verified", "attempts": 1, "rows": 10, "model_sql": "select product_id,\n  coalesce(sum(qty_on_hand) filter (where warehouse = 'A'), 0) as wh_a,\n  coalesce(sum(qty_on_hand) filter (where warehouse = 'B'), 0) as wh_b\nfrom {{ source('legacy', 'inventory') }} group by product_id\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 10, "new_rows": 10, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_inventory_pivot\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.inventory_pivot') IS NOT NULL DROP TABLE dbo.inventory_pivot;\nSELECT product_id, ISNULL([A],0) AS wh_a, ISNULL([B],0) AS wh_b INTO dbo.inventory_pivot\nFROM (SELECT product_id, warehouse, qty_on_hand FROM dbo.inventory) s PIVOT (SUM(qty_on_hand) FOR warehouse IN ([A],[B])) p;\nEND\n", "name": "026_inventory_pivot"}, {"id": 27, "slug": "largest_order_per_customer", "difficulty": "medium", "tags": ["cross-apply", "top-1"], "status": "verified", "attempts": 1, "rows": 10, "model_sql": "select customer_id, order_id, amount from {{ source('legacy', 'orders') }}\nqualify row_number() over (partition by customer_id order by amount desc, order_id) = 1\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 10, "new_rows": 10, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_largest_order_per_customer\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.largest_order_per_customer') IS NOT NULL DROP TABLE dbo.largest_order_per_customer;\nSELECT c.customer_id, t.order_id, t.amount INTO dbo.largest_order_per_customer FROM dbo.customers c\nCROSS APPLY (SELECT TOP 1 o.order_id, o.amount FROM dbo.orders o WHERE o.customer_id = c.customer_id ORDER BY o.amount DESC, o.order_id) t;\nEND\n", "name": "027_largest_order_per_customer"}, {"id": 28, "slug": "legacy_code_cleanup", "difficulty": "easy", "tags": ["try_cast"], "status": "verified", "attempts": 1, "rows": 12, "model_sql": "select customer_id, legacy_code, try_cast(legacy_code as integer) as legacy_code_num,\n  case when try_cast(legacy_code as integer) is null then 1 else 0 end as invalid\nfrom {{ source('legacy', 'customers') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 12, "new_rows": 12, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_legacy_code_cleanup\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.legacy_code_cleanup') IS NOT NULL DROP TABLE dbo.legacy_code_cleanup;\nSELECT customer_id, legacy_code, TRY_CAST(legacy_code AS INT) AS legacy_code_num,\n  IIF(TRY_CAST(legacy_code AS INT) IS NULL, 1, 0) AS invalid\nINTO dbo.legacy_code_cleanup FROM dbo.customers;\nEND\n", "name": "028_legacy_code_cleanup"}, {"id": 29, "slug": "fiscal_calendar", "difficulty": "medium", "tags": ["eomonth", "datename", "modulo"], "status": "verified", "attempts": 1, "rows": 34, "model_sql": "select order_id, order_date, last_day(order_date) as month_end,\n  case when month(order_date) >= 4 then year(order_date) + 1 else year(order_date) end as fiscal_year,\n  ((month(order_date) + 8) % 12) // 3 + 1 as fiscal_qtr,\n  dayname(order_date) as dow\nfrom {{ source('legacy', 'orders') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 34, "new_rows": 34, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_fiscal_calendar\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.fiscal_calendar') IS NOT NULL DROP TABLE dbo.fiscal_calendar;\nSELECT order_id, order_date, EOMONTH(order_date) AS month_end,\n  CASE WHEN MONTH(order_date) >= 4 THEN YEAR(order_date) + 1 ELSE YEAR(order_date) END AS fiscal_year,\n  ((MONTH(order_date) + 8) % 12) / 3 + 1 AS fiscal_qtr,\n  DATENAME(weekday, order_date) AS dow\nINTO dbo.fiscal_calendar FROM dbo.orders;\nEND\n", "name": "029_fiscal_calendar"}, {"id": 30, "slug": "order_outstanding_update_join", "difficulty": "medium", "tags": ["update-from", "temp-tables"], "status": "verified", "attempts": 1, "rows": 34, "model_sql": "select o.order_id, o.amount, coalesce(x.total, 0) as paid, o.amount - coalesce(x.total, 0) as outstanding, x.last_dt as last_paid\nfrom {{ source('legacy', 'orders') }} o\nleft join (select order_id, sum(paid_amount) as total, max(paid_date) as last_dt from {{ source('legacy', 'payments') }} group by order_id) x\n  on x.order_id = o.order_id\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 34, "new_rows": 34, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_order_outstanding_update_join\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.order_outstanding_update_join') IS NOT NULL DROP TABLE dbo.order_outstanding_update_join;\nSELECT o.order_id, o.amount, CAST(0 AS DECIMAL(18,2)) AS paid, CAST(NULL AS DATE) AS last_paid INTO #t FROM dbo.orders o;\nUPDATE t SET paid = x.total, last_paid = x.last_dt FROM #t t\nJOIN (SELECT order_id, SUM(paid_amount) AS total, MAX(paid_date) AS last_dt FROM dbo.payments GROUP BY order_id) x ON x.order_id = t.order_id;\nSELECT order_id, amount, paid, amount - paid AS outstanding, last_paid INTO dbo.order_outstanding_update_join FROM #t;\nEND\n", "name": "030_order_outstanding_update_join"}, {"id": 31, "slug": "item_volume_discount_cursor", "difficulty": "hard", "tags": ["cursor", "control-break"], "status": "verified", "attempts": 1, "rows": 70, "model_sql": "select item_id, order_id, qty, running_qty,\n  case when running_qty >= 10 then 10 when running_qty >= 5 then 5 else 0 end as discount_pct\nfrom (select item_id, order_id, qty,\n        cast(sum(qty) over (partition by order_id order by item_id rows between unbounded preceding and current row) as integer) as running_qty\n      from {{ source('legacy', 'order_items') }}) t\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 70, "new_rows": 70, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_item_volume_discount_cursor\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.item_volume_discount_cursor') IS NOT NULL DROP TABLE dbo.item_volume_discount_cursor;\nCREATE TABLE dbo.item_volume_discount_cursor (item_id INT, order_id INT, qty INT, running_qty INT, discount_pct INT);\nDECLARE @item INT, @ord INT, @q INT, @prev INT = NULL, @run INT = 0;\nDECLARE c CURSOR FOR SELECT item_id, order_id, qty FROM dbo.order_items ORDER BY order_id, item_id;\nOPEN c; FETCH NEXT FROM c INTO @item, @ord, @q;\nWHILE @@FETCH_STATUS = 0\nBEGIN\n    IF @prev IS NULL OR @prev <> @ord SET @run = 0;\n    SET @run = @run + @q; SET @prev = @ord;\n    INSERT INTO dbo.item_volume_discount_cursor VALUES (@item, @ord, @q, @run, CASE WHEN @run >= 10 THEN 10 WHEN @run >= 5 THEN 5 ELSE 0 END);\n    FETCH NEXT FROM c INTO @item, @ord, @q;\nEND\nCLOSE c; DEALLOCATE c;\nEND\n", "name": "031_item_volume_discount_cursor"}, {"id": 32, "slug": "customer_first_last_order", "difficulty": "medium", "tags": ["first_value", "last_value", "window-frame"], "status": "verified", "attempts": 1, "rows": 10, "model_sql": "select distinct customer_id,\n  first_value(order_id) over (partition by customer_id order by order_date, order_id rows between unbounded preceding and unbounded following) as first_order,\n  last_value(order_id) over (partition by customer_id order by order_date, order_id rows between unbounded preceding and unbounded following) as last_order\nfrom {{ source('legacy', 'orders') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 10, "new_rows": 10, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_customer_first_last_order\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.customer_first_last_order') IS NOT NULL DROP TABLE dbo.customer_first_last_order;\nSELECT DISTINCT customer_id,\n  FIRST_VALUE(order_id) OVER (PARTITION BY customer_id ORDER BY order_date, order_id ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS first_order,\n  LAST_VALUE(order_id) OVER (PARTITION BY customer_id ORDER BY order_date, order_id ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS last_order\nINTO dbo.customer_first_last_order FROM dbo.orders;\nEND\n", "name": "032_customer_first_last_order"}, {"id": 33, "slug": "median_order_by_region", "difficulty": "medium", "tags": ["percentile_cont"], "status": "verified", "attempts": 1, "rows": 5, "model_sql": "select c.region, quantile_cont(cast(o.amount as double), 0.5) as median_amount\nfrom {{ source('legacy', 'orders') }} o join {{ source('legacy', 'customers') }} c on c.customer_id = o.customer_id group by c.region\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 5, "new_rows": 5, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_median_order_by_region\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.median_order_by_region') IS NOT NULL DROP TABLE dbo.median_order_by_region;\nSELECT DISTINCT c.region, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY o.amount) OVER (PARTITION BY c.region) AS median_amount\nINTO dbo.median_order_by_region FROM dbo.orders o JOIN dbo.customers c ON c.customer_id = o.customer_id;\nEND\n", "name": "033_median_order_by_region"}, {"id": 34, "slug": "repeat_purchase_flag", "difficulty": "medium", "tags": ["lag", "datediff"], "status": "verified", "attempts": 1, "rows": 34, "model_sql": "select order_id, customer_id, order_date,\n  lag(order_date) over (partition by customer_id order by order_date, order_id) as prev_date,\n  case when date_diff('day', lag(order_date) over (partition by customer_id order by order_date, order_id), order_date) <= 7 then 1 else 0 end as is_repeat_7d\nfrom {{ source('legacy', 'orders') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 34, "new_rows": 34, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_repeat_purchase_flag\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.repeat_purchase_flag') IS NOT NULL DROP TABLE dbo.repeat_purchase_flag;\nSELECT order_id, customer_id, order_date,\n  LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS prev_date,\n  CASE WHEN DATEDIFF(day, LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date, order_id), order_date) <= 7 THEN 1 ELSE 0 END AS is_repeat_7d\nINTO dbo.repeat_purchase_flag FROM dbo.orders;\nEND\n", "name": "034_repeat_purchase_flag"}, {"id": 35, "slug": "mom_growth", "difficulty": "hard", "tags": ["lag", "nullif", "decimal-rounding"], "status": "verified", "attempts": 1, "rows": 4, "model_sql": "with m as (select year(order_date) as yr, month(order_date) as mo, sum(amount) as rev from {{ source('legacy', 'orders') }}\n           where lower(status) not in ('cancelled','returned') group by 1, 2)\nselect yr, mo, rev, lag(rev) over (order by yr, mo) as prev_rev,\n  round((rev - lag(rev) over (order by yr, mo)) * 100.0 / nullif(lag(rev) over (order by yr, mo), 0), 2) as growth_pct\nfrom m\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 4, "new_rows": 4, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_mom_growth\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.mom_growth') IS NOT NULL DROP TABLE dbo.mom_growth;\nWITH m AS (SELECT YEAR(order_date) AS yr, MONTH(order_date) AS mo, SUM(amount) AS rev FROM dbo.orders\n           WHERE status NOT IN ('cancelled','returned') GROUP BY YEAR(order_date), MONTH(order_date))\nSELECT yr, mo, rev, LAG(rev) OVER (ORDER BY yr, mo) AS prev_rev,\n  ROUND((rev - LAG(rev) OVER (ORDER BY yr, mo)) * 100.0 / NULLIF(LAG(rev) OVER (ORDER BY yr, mo), 0), 2) AS growth_pct\nINTO dbo.mom_growth FROM m;\nEND\n", "name": "035_mom_growth"}, {"id": 36, "slug": "customer_name_cleanup", "difficulty": "medium", "tags": ["string-functions", "null-concat"], "status": "verified", "attempts": 1, "rows": 12, "model_sql": "select customer_id, upper(trim(customer_name)) as clean_name, left(ltrim(customer_name), 1) as initial,\n  customer_name || ' <' || email || '>' as display,\n  replace(lower(trim(customer_name)), ' ', '_') as slug, length(rtrim(customer_name)) as name_len\nfrom {{ source('legacy', 'customers') }}\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 12, "new_rows": 12, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_customer_name_cleanup\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.customer_name_cleanup') IS NOT NULL DROP TABLE dbo.customer_name_cleanup;\nSELECT customer_id, UPPER(LTRIM(RTRIM(customer_name))) AS clean_name, LEFT(LTRIM(customer_name), 1) AS initial,\n  customer_name + ' <' + email + '>' AS display,\n  REPLACE(LOWER(RTRIM(LTRIM(customer_name))), ' ', '_') AS slug, LEN(customer_name) AS name_len\nINTO dbo.customer_name_cleanup FROM dbo.customers;\nEND\n", "name": "036_customer_name_cleanup"}, {"id": 37, "slug": "customer_segments_cte_chain", "difficulty": "medium", "tags": ["cte-chain", "decimal-division"], "status": "verified", "attempts": 1, "rows": 8, "model_sql": "with a as (select order_id, customer_id, amount from {{ source('legacy', 'orders') }} where lower(status) not in ('cancelled','returned')),\nb as (select customer_id, count _return_rate') IS NOT NULL DROP TABLE dbo.product_return_rate;\nSELECT p.product_id, p.product_name, COUNT(*) AS line_count,\n  SUM(CASE WHEN o.status = 'returned' THEN 1 ELSE 0 END) AS returned_lines,\n  CAST(SUM(CASE WHEN o.status = 'returned' THEN 1 ELSE 0 END) AS FLOAT) / COUNT(*) AS return_rate\nINTO dbo.product_return_rate FROM dbo.order_items i JOIN dbo.orders o ON o.order_id = i.order_id\nJOIN dbo.products p ON p.product_id = i.product_id GROUP BY p.product_id, p.product_name;\nEND\n", "name": "038_product_return_rate"}, {"id": 39, "slug": "east_markup_update_delete", "difficulty": "hard", "tags": ["update", "delete", "temp-tables", "decimal-rounding"], "status": "verified", "attempts": 1, "rows": 29, "model_sql": "select o.order_id, o.customer_id,\n  case when c.region = 'East' then round(o.amount * 1.1, 2) else o.amount end as amount, o.status\nfrom {{ source('legacy', 'orders') }} o left join {{ source('legacy', 'customers') }} c on c.customer_id = o.customer_id\nwhere lower(o.status) <> 'cancelled'\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 29, "new_rows": 29, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_east_markup_update_delete\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.east_markup_update_delete') IS NOT NULL DROP TABLE dbo.east_markup_update_delete;\nSELECT order_id, customer_id, amount, status INTO #o FROM dbo.orders;\nUPDATE o SET amount = o.amount * 1.1 FROM #o o JOIN dbo.customers c ON c.customer_id = o.customer_id WHERE c.region = 'East';\nDELETE FROM #o WHERE status = 'cancelled';\nSELECT * INTO dbo.east_markup_update_delete FROM #o;\nEND\n", "name": "039_east_markup_update_delete"}, {"id": 40, "slug": "customer_scorecard", "difficulty": "easy", "tags": ["conditional-aggregation"], "status": "verified", "attempts": 1, "rows": 12, "model_sql": "select c.customer_id,\n  sum(case when lower(o.status) = 'shipped' then o.amount else 0 end) as shipped_amt,\n  sum(case when lower(o.status) = 'pending' then o.amount else 0 end) as pending_amt,\n  sum(case when lower(o.status) = 'cancelled' then o.amount else 0 end) as cancelled_amt,\n  max(o.order_date) as last_order, count(o.order_id) as orders\nfrom {{ source('legacy', 'customers') }} c left join {{ source('legacy', 'orders') }} o on o.customer_id = c.customer_id group by c.customer_id\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 12, "new_rows": 12, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_customer_scorecard\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.customer_scorecard') IS NOT NULL DROP TABLE dbo.customer_scorecard;\nSELECT c.customer_id,\n  SUM(CASE WHEN o.status = 'shipped' THEN o.amount ELSE 0 END) AS shipped_amt,\n  SUM(CASE WHEN o.status = 'pending' THEN o.amount ELSE 0 END) AS pending_amt,\n  SUM(CASE WHEN o.status = 'cancelled' THEN o.amount ELSE 0 END) AS cancelled_amt,\n  MAX(o.order_date) AS last_order, COUNT(o.order_id) AS orders\nINTO dbo.customer_scorecard FROM dbo.customers c LEFT JOIN dbo.orders o ON o.customer_id = c.customer_id GROUP BY c.customer_id;\nEND\n", "name": "040_customer_scorecard"}, {"id": 41, "slug": "hardware_not_software_buyers", "difficulty": "easy", "tags": ["except"], "status": "verified", "attempts": 1, "rows": 1, "model_sql": "select distinct o.customer_id from {{ source('legacy', 'orders') }} o\njoin {{ source('legacy', 'order_items') }} i on i.order_id = o.order_id join {{ source('legacy', 'products') }} p on p.product_id = i.product_id where p.category = 'Hardware'\nexcept\nselect distinct o.customer_id from {{ source('legacy', 'orders') }} o\njoin {{ source('legacy', 'order_items') }} i on i.order_id = o.order_id join {{ source('legacy', 'products') }} p on p.product_id = i.product_id where p.category = 'Software'\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 1, "new_rows": 1, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_hardware_not_software_buyers\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.hardware_not_software_buyers') IS NOT NULL DROP TABLE dbo.hardware_not_software_buyers;\nSELECT DISTINCT o.customer_id INTO dbo.hardware_not_software_buyers FROM dbo.orders o\nJOIN dbo.order_items i ON i.order_id = o.order_id JOIN dbo.products p ON p.product_id = i.product_id WHERE p.category = 'Hardware'\nEXCEPT\nSELECT DISTINCT o.customer_id FROM dbo.orders o\nJOIN dbo.order_items i ON i.order_id = o.order_id JOIN dbo.products p ON p.product_id = i.product_id WHERE p.category = 'Software';\nEND\n", "name": "041_hardware_not_software_buyers"}, {"id": 42, "slug": "rolling_30d_revenue", "difficulty": "hard", "tags": ["correlated-subquery", "date-window"], "status": "verified", "attempts": 1, "rows": 27, "model_sql": "select d.order_date, sum(o2.amount) as rolling_30d\nfrom (select distinct order_date from {{ source('legacy', 'orders') }}) d\nleft join {{ source('legacy', 'orders') }} o2 on o2.order_date > d.order_date - 30 and o2.order_date <= d.order_date\n  and lower(o2.status) not in ('cancelled','returned')\ngroup by d.order_date\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 27, "new_rows": 27, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_rolling_30d_revenue\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.rolling_30d_revenue') IS NOT NULL DROP TABLE dbo.rolling_30d_revenue;\nSELECT d.order_date,\n  (SELECT SUM(o2.amount) FROM dbo.orders o2 WHERE o2.order_date > DATEADD(day, -30, d.order_date) AND o2.order_date <= d.order_date\n     AND o2.status NOT IN ('cancelled','returned')) AS rolling_30d\nINTO dbo.rolling_30d_revenue FROM (SELECT DISTINCT order_date FROM dbo.orders) d;\nEND\n", "name": "042_rolling_30d_revenue"}, {"id": 43, "slug": "payment_balance_cursor", "difficulty": "hard", "tags": ["cursor", "running-total", "control-break"], "status": "verified", "attempts": 1, "rows": 21, "model_sql": "select p.payment_id, p.order_id, p.paid_amount,\n  sum(p.paid_amount) over (partition by p.order_id order by p.paid_date, p.payment_id rows between unbounded preceding and current row) as cumulative_paid,\n  o.amount - sum(p.paid_amount) over (partition by p.order_id order by p.paid_date, p.payment_id rows between unbounded preceding and current row) as balance_after,\n  case when sum(p.paid_amount) over (partition by p.order_id order by p.paid_date, p.payment_id rows between unbounded preceding and current row) > o.amount then 1 else 0 end as overpaid\nfrom {{ source('legacy', 'payments') }} p join {{ source('legacy', 'orders') }} o on o.order_id = p.order_id\n", "history": [{"attempt": 1, "status": "match", "detail": {"equivalent": true, "legacy_rows": 21, "new_rows": 21, "issues": []}}], "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_payment_balance_cursor\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.payment_balance_cursor') IS NOT NULL DROP TABLE dbo.payment_balance_cursor;\nCREATE TABLE dbo.payment_balance_cursor (payment_id INT, order_id INT, paid_amount DECIMAL(18,2), cumulative_paid DECIMAL(18,2), balance_after DECIMAL(18,2), overpaid INT);\nDECLARE @pid INT, @oid INT, @paid DECIMAL(18,2), @amt DECIMAL(18,2), @prev INT = NULL, @cum DECIMAL(18,2) = 0;\nDECLARE c CURSOR FOR SELECT p.payment_id, p.order_id, p.paid_amount, o.amount FROM dbo.payments p JOIN dbo.orders o ON o.order_id = p.order_id\n  ORDER BY p.order_id, p.paid_date, p.payment_id;\nOPEN c; FETCH NEXT FROM c INTO @pid, @oid, @paid, @amt;\nWHILE @@FETCH_STATUS = 0\nBEGIN\n    IF @prev IS NULL OR @prev <> @oid SET @cum = 0;\n    SET @cum = @cum + @paid; SET @prev = @oid;\n    INSERT INTO dbo.payment_balance_cursor VALUES (@pid, @oid, @paid, @cum, @amt - @cum, CASE WHEN @cum > @amt THEN 1 ELSE 0 END);\n    FETCH NEXT FROM c INTO @pid, @oid, @paid, @amt;\nEND\nCLOSE c; DEALLOCATE c;\nEND\n", "name": "043_payment_balance_cursor"}, {"id": 44, "slug": "regi
