d\n    FROM {{ source('legacy', 'orders') }} o\n    LEFT JOIN pay p ON p.order_id = o.order_id\n)\nSELECT order_id,\n       amount,\n       paid,\n       amount - paid AS outstanding,\n       last_paid\nFROM t", "status": "match", "detail": {"equivalent": true, "legacy_rows": 34, "new_rows": 34, "issues": []}}], "explanation": "This procedure builds one row per order showing how much has been paid and what is still owed. Each order's payments are totaled, and the most recent payment date is recorded. Orders with no payments show zero paid and no last payment date. Outstanding is the order amount minus the amount paid.", "llm_calls": [{"model": "claude-haiku-5-5", "input_tokens": 1634, "output_tokens": 2026, "cache_write_tokens": 0, "cache_read_tokens": 0, "cost_usd": 0.001176}], "cost_usd": 0.001176, "legacy_sql": "CREATE OR ALTER PROCEDURE dbo.usp_order_outstanding_update_join\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF OBJECT_ID('dbo.order_outstanding_update_join') IS NOT NULL DROP TABLE dbo.order_outstanding_update_join;\nSELECT o.order_id, o.amount, CAST(0 AS DECIMAL(18,2)) AS paid, CAST(NULL AS DATE) AS last_paid INTO #t FROM dbo.orders o;\nUPDATE t SET paid = x.total, last_paid = x.last_dt FROM #t t\nJOIN (SELECT order_id, SUM(paid_amount) AS total, MAX(paid_date) AS last_dt FROM dbo.payments GROUP BY order_id) x ON x.order_id = t.order_id;\nSELECT order_id, amount, paid, amount - paid AS outstanding, last_paid INTO dbo.order_outstanding_update_join FROM #t;\nEND\n", "name": "030_order_outstanding_update_join"}, {"id": 31, "slug": "item_volume_discount_cursor", "difficulty": "hard", "tags": ["cursor", "control-break"], "status": "verified", "attempts": 1, "rows": 70, "model_sql": "WITH base AS (\n    SELECT\n        item_id,\n        order_id,\n        qty,\n        SUM(qty) OVER (\n            PARTITION BY order_id\n            ORDER BY item_id\n            ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n        ) AS run_sum,\n        COUNT(*) OVER (\n
